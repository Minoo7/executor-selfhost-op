name: Beta.19 account controls

on:
  push:
    branches: [fix/beta19-preserve-account-controls, feat/credential-file-upload]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run check
      - run: bun run docs:validate
      - run: bun run e2e:prepare
      - run: bun run e2e:self-host --workers 2 --test-name 'Account creators convert|App RPC delivers|React app deployments compile Tailwind|Hosted dashboard runs of approval-gated|Group sharing forms retain|Groups enforce private|Credential files preserve PEM|Pasted credentials are named|The credential form shows|the connect form says|an app manager without use of an app-account webhook'
