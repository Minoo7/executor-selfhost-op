user root root;
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;
events { worker_connections 1024; }
http {
    log_format pilot '$request_method $uri $status';
    access_log /dev/stdout pilot;
    client_max_body_size 32m;
    map $ssl_server_name $pilot_certificate_base {
        default "";
        executor-auth-pilot.planasolutions.ai /certs/executor-auth-pilot.planasolutions.ai;
    }
    server {
        listen 10.255.44.1:443 ssl default_server;
        ssl_reject_handshake on;
        return 421;
    }
    server {
        listen 10.255.44.1:443 ssl;
        server_name executor-auth-pilot.planasolutions.ai;
        ssl_protocols TLSv1.2 TLSv1.3;
        # Variable paths pick up ACME renewals without an nginx restart.
        ssl_certificate ${pilot_certificate_base}.crt;
        ssl_certificate_key ${pilot_certificate_base}.key;
        if ($host != executor-auth-pilot.planasolutions.ai) { return 421; }
        location ~ ^(/mcp|/[.]well-known/oauth-protected-resource(/mcp)?|/[.]well-known/oauth-authorization-server(/api/auth)?|/api/auth/oauth2/(register|authorize|token|revoke|public-client|consent))$ {
            proxy_pass http://127.0.0.1:4400;
            proxy_set_header Host executor-auth-pilot.planasolutions.ai;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 310s;
        }
        location / { return 404; }
    }
}
